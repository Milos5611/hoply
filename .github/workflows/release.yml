name: Release

# Push a tag like v0.2.0 to build, test, sign, notarize and publish Hoply-0.2.0.dmg as a GitHub Release.
# Run it by hand (Actions → Release → Run workflow) to get the DMG as a build artifact only.
# Without the signing secrets the DMG is ad-hoc signed and not notarized, and no release is published.
# With the Sparkle secrets the app checks for updates and appcast.xml is published with the DMG; a release
# needs them, or its users would never hear of the next one. An annotated tag's message becomes the notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8_BASE64 != '' }}
      HAS_SPARKLE: ${{ secrets.SPARKLE_PUBLIC_KEY != '' && secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "No Developer ID Application identity in the .p12" >&2; exit 1; }
          echo "HOPLY_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Write the notary key
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # checkout can leave an annotated tag lightweight; fetch the tag object itself.
          git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" | sed '/^-----BEGIN /,$d' > "$RUNNER_TEMP/notes.md"
            if [ -s "$RUNNER_TEMP/notes.md" ]; then echo "HOPLY_RELEASE_NOTES=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"; fi
          fi

      - name: Package
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export HOPLY_VERSION="${GITHUB_REF_NAME#v}"; fi
          [ "$HAS_SPARKLE" = true ] || unset SPARKLE_PUBLIC_KEY SPARKLE_PRIVATE_KEY
          dmg="$(scripts/package.sh)"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Hoply
          path: |
            ${{ env.DMG }}
            build/appcast.xml
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
          && env.HAS_SPARKLE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=()
          if [ -n "${HOPLY_RELEASE_NOTES:-}" ]; then notes=(--notes-file "$HOPLY_RELEASE_NOTES"); fi
          gh release create "$GITHUB_REF_NAME" "$DMG" build/appcast.xml --title "Hoply ${GITHUB_REF_NAME#v}" \
            --generate-notes "${notes[@]}"

      - name: Explain a skipped release
        if: >-
          startsWith(github.ref, 'refs/tags/v') && !(env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
          && env.HAS_SPARKLE == 'true')
        run: echo "::warning::No release published; it needs the Developer ID, notary and Sparkle secrets (README → Releasing)."

      - name: Remove the signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"
