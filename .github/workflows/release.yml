name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  HOPLY_REPO: Milos5611/homebrew-hoply # package.sh and cask.sh read it too

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8_BASE64 != '' }}
      HAS_SPARKLE: ${{ secrets.SPARKLE_PUBLIC_KEY != '' && secrets.SPARKLE_PRIVATE_KEY != '' }}
      HAS_TAP: ${{ secrets.TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "No Developer ID Application identity in the .p12" >&2; exit 1; }
          echo "HOPLY_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Write the notary key
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # checkout can leave an annotated tag lightweight; fetch the tag object itself.
          git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" | sed '/^-----BEGIN /,$d' > "$notes"
          fi
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "What changed in Hoply ${GITHUB_REF_NAME#v}: [hoply.dev/changelog](https://hoply.dev/changelog)" > "$notes"
          fi
          echo "HOPLY_RELEASE_NOTES=$notes" >> "$GITHUB_ENV"

      - name: Package
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export HOPLY_VERSION="${GITHUB_REF_NAME#v}"; fi
          [ "$HAS_SPARKLE" = true ] || unset SPARKLE_PUBLIC_KEY SPARKLE_PRIVATE_KEY
          dmg="$(scripts/package.sh)"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: Hoply
          path: |
            ${{ env.DMG }}
            build/appcast.xml
          if-no-files-found: error

      - name: Publish the GitHub Release on the tap repo
        if: >-
          startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
          && env.HAS_SPARKLE == 'true' && env.HAS_TAP == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          # Hoply.dmg backs https://hoply.dev/download (releases/latest/download/Hoply.dmg).
          cp "$DMG" build/Hoply.dmg
          gh release create "$GITHUB_REF_NAME" "$DMG" build/Hoply.dmg build/appcast.xml --repo "$HOPLY_REPO" \
            --title "Hoply ${GITHUB_REF_NAME#v}" --notes-file "$HOPLY_RELEASE_NOTES"

      - name: Check out the tap
        if: >-
          startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
          && env.HAS_SPARKLE == 'true' && env.HAS_TAP == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.HOPLY_REPO }}
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Update the Homebrew cask
        if: >-
          startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
          && env.HAS_SPARKLE == 'true' && env.HAS_TAP == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha256="$(shasum -a 256 "$DMG" | cut -d ' ' -f 1)"
          mkdir -p tap/Casks
          scripts/cask.sh "$version" "$sha256" > tap/Casks/hoply.rb
          cd tap
          git add Casks/hoply.rb
          if git diff --cached --quiet; then echo "Casks/hoply.rb is already at $version"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "hoply $version"
          git push origin HEAD

      - name: Explain a skipped release
        if: >-
          startsWith(github.ref, 'refs/tags/v') && !(env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
          && env.HAS_SPARKLE == 'true' && env.HAS_TAP == 'true')
        run: echo "::warning::No release published; it needs the Developer ID, notary, Sparkle and TAP_TOKEN secrets (docs/RELEASING.md)."

      - name: Remove the signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"
